name: V0 Auto Resume

on:
  workflow_run:
    workflows: ["V0 Validation Resumable"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Download continuation signal from completed V0 run
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: v0_validation.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: v0-resume-signal
          path: resume_signal
          if_no_artifact_found: warn

      - name: Check whether continuation is required
        id: check
        run: |
          if [ -f resume_signal/resume.txt ] && grep -qx 'resume=true' resume_signal/resume.txt; then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
            echo 'Continuation signal found.'
          else
            echo 'resume=false' >> "$GITHUB_OUTPUT"
            echo 'No continuation signal. This V0 run does not need another chunk.'
          fi

      - name: Dispatch next V0 chunk
        if: steps.check.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Dispatching the next V0 Validation Resumable chunk.'
          gh workflow run "V0 Validation Resumable" --repo "$REPOSITORY"
