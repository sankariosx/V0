name: V0 Validation Run

on:
  workflow_dispatch: {}

jobs:
  run-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Restore checkpoints from the previous run (if any)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          if_no_artifact_found: warn

      - name: Run the validation for this chunk of time
        working-directory: v0_flat
        run: |
          set +e
          timeout --signal=SIGTERM --kill-after=60s 20400s python3 -u run_v0_parallel.py --workers 2
          EXIT_CODE=$?
          echo "Python/timeout exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "V0 finished normally."
          elif [ "$EXIT_CODE" -eq 124 ]; then
            echo "Time limit reached. Checkpoints should allow the next run to resume."
          else
            echo "V0 FAILED with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Show checkpoint status
        if: always()
        working-directory: v0_flat
        run: |
          echo "Results directory:"
          find results -maxdepth 3 -type f 2>/dev/null | sort || true
          echo ""
          echo "Number of checkpoint JSON files:"
          find results/checkpoints -name "*.json" -type f 2>/dev/null | wc -l || true

      - name: Save progress so the next run can resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Save the final report, once everything is complete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-report
          path: v0_flat/results/v0_report_parallel.json
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
