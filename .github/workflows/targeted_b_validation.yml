name: V0 Targeted B1 B2 Validation

on:
  push:
    paths:
      - 'v0_flat/targeted_b_validation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary --retries 5 --timeout 120             --index-url https://pypi.org/simple             interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4

      - name: Run targeted B1/B2 at 0.3
        working-directory: v0_flat
        run: python3 -u targeted_b_validation.py
