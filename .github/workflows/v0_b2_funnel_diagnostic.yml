name: V0 B2 Funnel Diagnostic

on:
  push:
    branches: [v0-funnel-fix3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
      - name: Run targeted B2 discovery funnel diagnostic
        working-directory: v0_flat
        run: |
          PYTHONHASHSEED=0 python3 -u b2_funnel_diagnostic.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: b2-funnel-diagnostic
          path: v0_flat/results/b2_funnel_diagnostic.json
          retention-days: 30
