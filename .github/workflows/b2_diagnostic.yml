name: B2 Targeted Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [b2-diagnostic-fix]

jobs:
  b2-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        seed: [88117, 91751, 65440, 93810, 24107, 33084, 29450, 31025, 60097, 97094]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      B2_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned V0 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
      - name: Verify REAL EBM
        run: |
          python -c "from interpret.glassbox import ExplainableBoostingRegressor; print('EBM OK')"
      - name: Run one-seed B2 diagnostic
        working-directory: v0_flat
        run: python3 -u b2_diagnostic.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: b2-diagnostic-${{ matrix.seed }}
          path: v0_flat/results/b2_diagnostic_${{ matrix.seed }}.json
