name: V0 Run12 Finite Walk-Forward

on:
  workflow_dispatch:
  push:
    paths:
      - 'v0_flat/run12_walk_forward.py'
      - '.github/workflows/v0_run12_walk_forward.yml'

permissions:
  contents: read

concurrency:
  group: v0-run12-walk-forward
  cancel-in-progress: false

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validated V0 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
          python -c "from interpret.glassbox import ExplainableBoostingRegressor; print('REAL EBM OK')"

      - name: Download full Dukascopy S&P 500 M15 data
        working-directory: v0_flat
        run: |
          mkdir -p data
          npm install -g dukascopy-node
          dukascopy-node -i usa500idxusd -from 2015-01-01 -to 2026-09-01 -t m15 -f csv --batch-size 10 --batch-pause 1000
          f="download/usa500idxusd-m15-bid-2015-01-01-2026-09-01.csv"
          test -f "$f"
          cp "$f" data/sp500_m15.csv
          wc -l data/nasdaq100_m15.csv

      - name: Run finite walk-forward
        working-directory: v0_flat
        run: |
          python3 -m py_compile run12_walk_forward.py
          python3 -u run12_walk_forward.py

      - name: Upload final walk-forward report
        uses: actions/upload-artifact@v4
        with:
          name: v0-run12-sp500-walk-forward
          path: v0_flat/results/run12_walk_forward.json
          retention-days: 90
