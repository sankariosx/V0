name: User Edge XAUUSD Frozen OOS Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
  push:
    paths:
      - 'v0_flat/run_user_edge_oos.py'
      - '.github/workflows/user_edge_xauusd_oos.yml'

# Manual kickoff: this workflow also runs on push so frozen OOS can be started immediately when needed.
permissions:
  contents: read

concurrency:
  group: user-edge-xauusd-oos
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download latest Dukascopy XAUUSD M15 data
        working-directory: v0_flat
        run: |
          mkdir -p data
          npm install -g dukascopy-node
          TO_DATE="$(date -u +%F)"
          dukascopy-node -i xauusd -from 2015-01-01 -to "$TO_DATE" -t m15 -f csv --batch-size 10 --batch-pause 1000
          f="$(find download -maxdepth 1 -type f -name 'xauusd-m15-bid-*.csv' -print | sort | tail -n 1)"
          test -n "$f"
          test -f "$f"
          cp "$f" data/xauusd_m15.csv
          echo "Data through: $TO_DATE"
          wc -l data/xauusd_m15.csv
      - name: Install Python dependencies
        working-directory: v0_flat
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pandas
      - name: Run frozen OOS test
        run: |
          python3 -m py_compile v0_flat/run_user_edge_oos.py
          python3 -u v0_flat/run_user_edge_oos.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: user-edge-xauusd-frozen-oos
          path: v0_flat/results/user_edge_xauusd_oos.json
          retention-days: 90
