name: V0 Run10 Direct 4H Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0-run10-direct-4h
  cancel-in-progress: false

jobs:
  direct-4h-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install validated V0 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
          python -c "from interpret.glassbox import ExplainableBoostingRegressor; print('REAL EBM OK')"

      - name: Download Dukascopy XAUUSD M15 data
        working-directory: v0_flat
        run: |
          mkdir -p data
          npm install -g dukascopy-node
          dukascopy-node -i xauusd -from 2015-01-01 -to 2026-09-01 -t m15 -f csv --batch-size 10 --batch-pause 1000
          f="download/xauusd-m15-bid-2015-01-01-2026-09-01.csv"
          test -f "$f"
          cp "$f" data/xauusd_m15.csv
          wc -l data/xauusd_m15.csv

      - name: Run direct 4H discovery
        working-directory: v0_flat
        run: |
          python3 -m py_compile run10_direct_4h_discovery.py
          python3 -u run10_direct_4h_discovery.py

      - name: Upload direct 4H report
        uses: actions/upload-artifact@v4
        with:
          name: v0-run10-direct-4h
          path: v0_flat/results/run10_direct_4h_discovery.json
          retention-days: 90
