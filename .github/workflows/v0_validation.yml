name: V0 Validation Resumable
# 2026-09-22: launch from main after verified B2 discovery + validation-parity fixes.

on:
  workflow_dispatch:
  workflow_dispatch:
    inputs:
      resume_from_run_id:
        description: 'Exact workflow run ID whose v0-checkpoints artifact should be restored'
        required: false
        type: string
      clean_run:
        description: 'Start a fresh 170-job validation without restoring old checkpoints'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: v0-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 - REQUIRED for interpret
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies - PINNED for real EBM
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
          pip list | grep -E "interpret|scikit-learn|pandas|numpy|scipy"

      - name: Verify REAL EBM - FAIL LOUDLY if missing - no fallback
        run: |
          python -c "from interpret.glassbox import ExplainableBoostingRegressor; print('EBM OK - real EBM available')"
          python --version

      - name: Show exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git log -1 --oneline
          echo "event_name=${{ github.event_name }}"
          echo "resume_from_run_id=${{ inputs.resume_from_run_id }}"
          echo "clean_run=${{ inputs.clean_run }}"

      - name: Prepare checkpoint directory
        run: rm -rf v0_flat/results/checkpoints && mkdir -p v0_flat/results/checkpoints

      - name: Restore exact parent checkpoints
        if: github.event_name == 'workflow_dispatch' && inputs.clean_run != true && inputs.resume_from_run_id != ''
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          run_id: ${{ inputs.resume_from_run_id }}
          if_no_artifact_found: warn

      - name: Restore latest checkpoints for initial/manual run
        if: github.event_name == 'workflow_dispatch' && inputs.clean_run != true && inputs.resume_from_run_id == ''
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          if_no_artifact_found: warn

      - name: Confirm clean checkpoint state
        if: github.event_name == 'push' || inputs.clean_run == true
        working-directory: v0_flat
        run: |
          count=$(find results/checkpoints -type f -name '*.json' | wc -l)
          echo "Clean-run checkpoint count: $count"
          test "$count" -eq 0

      - name: Guard checkpoint versions
        working-directory: v0_flat
        run: python3 checkpoint_guard.py guard

      - name: Verify runner
        working-directory: v0_flat
        run: |
          python3 --version
          python3 -m py_compile run_v0_parallel.py parallel_runner.py config_final.py checkpoint_guard.py ebm_discovery.py
          echo 'V0 runner verification passed.'

      - name: Run V0 validation chunk - 170-job locked validation
        id: run_chunk
        working-directory: v0_flat
        run: |
          set +e
          timeout --signal=SIGTERM --kill-after=60s 330m python3 -u run_v0_parallel.py --workers 2
          code=$?
          echo "V0 exit code: $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            echo 'V0 failed.'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo 'Chunk time limit reached; checkpoints will be uploaded and the next chunk will be dispatched directly.'
            echo 'continue=true' >> "$GITHUB_OUTPUT"
          else
            echo 'V0 completed normally.'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify checkpoint provenance before upload
        id: stamp
        if: always()
        working-directory: v0_flat
        run: python3 checkpoint_guard.py stamp

      - name: Show results
        if: always()
        working-directory: v0_flat
        run: |
          echo '=== Checkpoint count ==='
          find results/checkpoints -type f -name '*.json' 2>/dev/null | wc -l || true
          echo '=== Report ==='
          test -f results/v0_report_parallel.json && cat results/v0_report_parallel.json || true

      - name: Upload checkpoints
        if: steps.stamp.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-report
          path: v0_flat/results/v0_report_parallel.json
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Signal automatic continuation
        if: always() && steps.run_chunk.outputs.continue == 'true' && steps.stamp.outcome == 'success'
        run: |
          mkdir -p v0_resume_signal
          echo "resume=true" > v0_resume_signal/resume.txt

      - name: Upload continuation signal
        if: always() && steps.run_chunk.outputs.continue == 'true' && steps.stamp.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v0-resume-signal
          path: v0_resume_signal/resume.txt
          retention-days: 7

      - name: Dispatch next V0 chunk directly
        if: always() && steps.run_chunk.outputs.continue == 'true' && steps.stamp.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Dispatching the next V0 Validation Resumable chunk directly.'
          echo "Passing parent run ID: $GITHUB_RUN_ID"
          gh workflow run "V0 Validation Resumable" --repo "$REPOSITORY" -f resume_from_run_id="$GITHUB_RUN_ID"

      - name: Continuation status
        if: always()
        run: |
          if [ "${{ steps.run_chunk.outputs.continue }}" = 'true' ] && [ "${{ steps.stamp.outcome }}" = "success" ]; then
            echo 'V0 chunk ended at the time limit; verified checkpoints uploaded and the next chunk was dispatched with the exact parent run ID.'
          elif [ "${{ steps.run_chunk.outputs.continue }}" = 'true' ]; then
            echo 'V0 chunk ended at the time limit, but checkpoint provenance verification failed; automatic continuation was intentionally blocked.'
          else
            echo 'No automatic continuation required.'
          fi
