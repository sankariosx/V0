name: V0 Validation Resumable

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: v0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 - REQUIRED for interpret
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies - PINNED for real EBM
        run: |
          python -m pip install --upgrade pip
          pip install interpret==0.4.4 scikit-learn==1.3.2 pandas==2.1.4 numpy==1.26.2 scipy==1.11.4
          pip list | grep -E "interpret|scikit-learn|pandas|numpy|scipy"

      - name: Verify REAL EBM - FAIL LOUDLY if missing - no fallback
        run: |
          python -c "from interpret.glassbox import ExplainableBoostingRegressor; print('EBM OK - real EBM available')"
          python --version

      - name: Show exact commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Prepare checkpoint directory
        run: mkdir -p v0_flat/results/checkpoints

      - name: Restore previous checkpoints
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          if_no_artifact_found: warn
          workflow_conclusion: success

      - name: Guard checkpoint versions
        working-directory: v0_flat
        run: python3 checkpoint_guard.py guard

      - name: Verify runner
        working-directory: v0_flat
        run: |
          python3 --version
          python3 -m py_compile run_v0_parallel.py parallel_runner.py config_final.py checkpoint_guard.py ebm_discovery.py
          echo 'V0 runner verification passed.'

      - name: Run V0 validation chunk - 170-job locked validation
        id: run_chunk
        working-directory: v0_flat
        run: |
          set +e
          timeout --signal=SIGTERM --kill-after=60s 330m python3 -u run_v0_parallel.py --workers 2
          code=$?
          echo "V0 exit code: $code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ] && [ "$code" -ne 143 ]; then
            echo 'V0 failed.'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo 'Chunk time limit reached; checkpoints will be uploaded and this workflow run will be resumed automatically.'
            echo 'continue=true' >> "$GITHUB_OUTPUT"
          else
            echo 'V0 completed normally.'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp checkpoint versions before upload
        if: always()
        working-directory: v0_flat
        run: python3 checkpoint_guard.py stamp

      - name: Show results
        if: always()
        working-directory: v0_flat
        run: |
          echo '=== Checkpoint files ==='
          find results/checkpoints -type f -name '*.json' -print 2>/dev/null | sort || true
          echo '=== Checkpoint count ==='
          find results/checkpoints -type f -name '*.json' 2>/dev/null | wc -l || true
          echo '=== Report ==='
          test -f results/v0_report_parallel.json && cat results/v0_report_parallel.json || true

      - name: Upload checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-checkpoints
          path: v0_flat/results/checkpoints
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-report
          path: v0_flat/results/v0_report_parallel.json
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      - name: Automatically resume after time limit
        if: always() && steps.run_chunk.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Chunk timed out normally. Triggering the next resumable run now...'
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/rerun"; then
              echo "Automatic continuation triggered successfully (attempt $attempt)."
              exit 0
            fi
            echo "Continuation trigger attempt $attempt failed; retrying in 10 seconds..."
            sleep 10
          done
          echo 'Could not trigger automatic continuation after 3 attempts.'
          exit 1

      - name: Continuation status
        if: always()
        run: |
          if [ "${{ steps.run_chunk.outputs.continue }}" = 'true' ]; then
            echo 'V0 chunk ended at the time limit; automatic resumable continuation was requested.'
          else
            echo 'No automatic continuation required.'
          fi
